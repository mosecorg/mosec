name: lint and test

on:
  pull_request:
    paths:
      - ".github/workflows/check.yml"
      - "mosec/**"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.lock"
      - "Cargo.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check.yml"
      - "mosec/**"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.lock"
      - "Cargo.toml"
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.14.0"
      - name: Install dependencies
        run: make install
      - name: Lint
        run: make lint semantic_lint

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-14]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.14.0"
      - name: Install components
        run: make install
      - name: Test unit
        run: make test_unit
      - name: Test
        run: make test
      - name: Test shm in Linux
        # ignore the shm test for Python 3.12 since pyarrow doesn't have py3.12 wheel with version < 12
        if: ${{ startsWith(matrix.os, 'ubuntu') && !startsWith(matrix.python-version, '3.12') && !startsWith(matrix.python-version, '3.13') && !startsWith(matrix.python-version, '3.14') }}
        run: |
          docker run --rm -d --name redis -p 6379:6379 redis
          make test_shm
          docker stop redis
